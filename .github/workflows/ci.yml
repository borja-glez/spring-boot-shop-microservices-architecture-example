name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build, tests, ArchUnit, Spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Integration tests start PostgreSQL, Kafka and RabbitMQ with Testcontainers.
      - name: Build and test
        run: ./gradlew build

  frontend:
    name: Frontend (Prettier, ESLint, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render every overlay
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" > /dev/null
            echo "::endgroup::"
          done
      - name: Validate the Compose files
        run: |
          docker compose -f deploy/compose/compose.yaml config -q
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.observability.yaml config -q
