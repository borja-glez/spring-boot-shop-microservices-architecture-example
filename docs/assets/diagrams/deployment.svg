<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Deployment options</title>
<desc id="desc">Docker Compose starts infrastructure, the seven services and the frontend with one command, with an optional observability overlay file. Kubernetes uses Kustomize: a base with namespace shop, StatefulSets for postgres, kafka and rabbitmq, Deployments with startup, readiness and liveness probes, probes; overlays local, native (GraalVM images), observability and scaled (local + observability + scaling); components observability (LGTM, dashboards, alerts) and scaling (2 replicas, PodDisruptionBudgets, HPA 2-3).</desc>
