<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Observability pipeline</title>
<desc id="desc">Every service exports traces, metrics and logs with Micrometer Observation and the OpenTelemetry SDK over OTLP/HTTP port 4318 to the OpenTelemetry Collector, which routes them to Tempo, Prometheus and Loki, visualised in Grafana with provisioned dashboards and alert rules. One order produces one distributed trace across HTTP, the CQRS bus, the outbox relay, Kafka, RabbitMQ and the saga steps.</desc>
<defs>
