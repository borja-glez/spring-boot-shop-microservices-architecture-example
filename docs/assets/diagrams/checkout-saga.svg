<text x="1077.5" y="569.5" font-size="14" fill="#f85149" font-weight="600" text-anchor="middle">CANCELLED</text>
<rect x="40" y="300" width="165" height="290" rx="12" fill="#11161d" stroke="#30363d" stroke-width="1.2" filter="url(#sh)" />
<text x="54" y="326" font-size="13" fill="#e6edf3" font-weight="600">Retries</text>
<text x="54" y="348" font-size="10.8" class="mono" fill="#e6edf3">technical failures:</text>
<text x="54" y="363" font-size="10.8" class="mono" fill="#8b949e">exponential backoff</text>
<text x="54" y="378" font-size="10.8" class="mono" fill="#d29922">1 s → 30 s</text>
<text x="54" y="401" font-size="10.8" class="mono" fill="#e6edf3">forward steps give up</text>
<text x="54" y="416" font-size="10.8" class="mono" fill="#8b949e">after 8 attempts</text>
<text x="54" y="439" font-size="10.8" class="mono" fill="#e6edf3">compensations never</text>
<text x="54" y="454" font-size="10.8" class="mono" fill="#8b949e">give up: STUCK after</text>
<text x="54" y="469" font-size="10.8" class="mono" fill="#8b949e">20 attempts, still</text>
<text x="54" y="484" font-size="10.8" class="mono" fill="#8b949e">retried</text>
<rect x="804" y="300" width="165" height="290" rx="12" fill="#11161d" stroke="#30363d" stroke-width="1.2" filter="url(#sh)" />
<text x="818" y="326" font-size="13" fill="#e6edf3" font-weight="600">Idempotency</text>
<text x="818" y="348" font-size="10.8" class="mono" fill="#e6edf3">remote commands are</text>
<text x="818" y="363" font-size="10.8" class="mono" fill="#8b949e">idempotent per</text>
<text x="818" y="378" font-size="10.8" class="mono" fill="#8b949e">order id</text>
<text x="818" y="401" font-size="10.8" class="mono" fill="#e6edf3">a business “no” is a</text>
<text x="818" y="416" font-size="10.8" class="mono" fill="#8b949e">reply value, not an</text>
<text x="818" y="431" font-size="10.8" class="mono" fill="#8b949e">exception</text>
<text x="818" y="454" font-size="10.8" class="mono" fill="#e6edf3">commands travel over</text>
<text x="818" y="469" font-size="10.8" class="mono" fill="#d29922">RabbitMQ</text>
<text x="818" y="484" font-size="10.8" class="mono" fill="#d29922">request / reply</text>
