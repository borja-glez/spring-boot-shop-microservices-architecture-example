<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">How the two libraries fit together</title>
<desc id="desc">spring-boot-cqrs routes commands, queries and events through buses, a middleware pipeline and local, RabbitMQ or Kafka transports to handlers. spring-boot-specification-repository turns the HTTP filter syntax into a whitelisted QueryPlan, lets the server add its own conditions and runs it as JPA Criteria SQL. A query handler calls the SpecificationRepository, joining both.</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
