<text x="40" y="48" font-size="24" fill="#e6edf3" font-weight="700">How the two libraries fit together</text>
<text x="40" y="72" font-size="13" class="mu">one request through Mercado: the controller dispatches on the bus, the handler queries with a whitelisted plan</text>
