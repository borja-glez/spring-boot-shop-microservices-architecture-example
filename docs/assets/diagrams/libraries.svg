<text x="86" y="175" font-size="14" fill="#e6edf3" font-weight="600">ProductController</text>
<text x="86" y="195" font-size="11.5" class="mono" fill="#8b949e">queries.ask(new SearchProductsQuery(plan, page))</text>
<text x="544" y="175" font-size="11.5" class="mono" fill="#3fb950" text-anchor="end">@RestController</text>
<rect x="70" y="240" width="490" height="60" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.2" filter="url(#sh)" />
<text x="86" y="265" font-size="14" fill="#e6edf3" font-weight="600">CommandBus · QueryBus · EventBus</text>
<text x="86" y="285" font-size="11.5" class="mono" fill="#8b949e">dispatch(command) · ask(query) · publish(event)</text>
<rect x="70" y="330" width="490" height="80" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.2" filter="url(#sh)" />
