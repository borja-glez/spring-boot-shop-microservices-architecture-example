<text x="86" y="465" font-size="14" fill="#e6edf3" font-weight="600">Transport</text>
<rect x="84" y="484" width="140" height="22" rx="5" fill="#e6edf3" fill-opacity="0.10" stroke="#e6edf3" stroke-opacity="0.55"/><text x="154.0" y="498.78" font-size="10.5" class="mono" fill="#e6edf3" text-anchor="middle">local (in-process)</text>
<rect x="232" y="484" width="186" height="22" rx="5" fill="#d29922" fill-opacity="0.10" stroke="#d29922" stroke-opacity="0.55"/><text x="325.0" y="498.78" font-size="10.5" class="mono" fill="#d29922" text-anchor="middle">RabbitMQ · request/reply</text>
<rect x="426" y="484" width="120" height="22" rx="5" fill="#f0883e" fill-opacity="0.10" stroke="#f0883e" stroke-opacity="0.55"/><text x="486.0" y="498.78" font-size="10.5" class="mono" fill="#f0883e" text-anchor="middle">Kafka · events</text>
<text x="544" y="465" font-size="11" class="mono" fill="#8b949e" text-anchor="end">chosen per message type</text>
<rect x="70" y="550" width="490" height="64" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.2" filter="url(#sh)" />
<text x="86" y="575" font-size="14" fill="#e6edf3" font-weight="600">CatalogQueryHandler</text>
<text x="86" y="595" font-size="11.5" class="mono" fill="#8b949e">@HandleQuery search(SearchProductsQuery)</text>
<text x="544" y="575" font-size="11.5" class="mono" fill="#3fb950" text-anchor="end">@QueryHandler</text>
<text x="70" y="640" font-size="11" class="mono" fill="#8b949e">messages are @CqrsMessage classes in the shared contracts module</text>
<rect x="640" y="150" width="490" height="60" rx="12" fill="#161b22" stroke="#db61a2" stroke-width="1.2" filter="url(#sh)" />
<text x="656" y="173" font-size="11.5" class="mono" fill="#e6edf3">GET /api/products?filter=price.amount:between:5|20</text>
<text x="656" y="194" font-size="10.6" class="mono" fill="#8b949e">&amp;orFilter=name:contains:cafe;tags:eq:ecologico&amp;sort=price.amount,desc</text>
<rect x="640" y="240" width="490" height="60" rx="12" fill="#161b22" stroke="#db61a2" stroke-width="1.2" filter="url(#sh)" />
<text x="656" y="265" font-size="14" fill="#e6edf3" font-weight="600">@FilterableQuery  →  QueryPlan&lt;Product&gt;</text>
<text x="656" y="285" font-size="11.5" class="mono" fill="#8b949e">field whitelist · filterableFields · sortableFields</text>
<rect x="640" y="330" width="490" height="80" rx="12" fill="#161b22" stroke="#db61a2" stroke-width="1.2" filter="url(#sh)" />
<text x="656" y="355" font-size="14" fill="#e6edf3" font-weight="600">Server-side conditions</text>
<rect x="654" y="366" width="214" height="18" rx="5" fill="#db61a2" fill-opacity="0.10" stroke="#db61a2" stroke-opacity="0.55"/><text x="761.0" y="378.78" font-size="10.5" class="mono" fill="#db61a2" text-anchor="middle">QueryPlans.requiring(ON_SALE)</text>
<rect x="876" y="366" width="186" height="18" rx="5" fill="#db61a2" fill-opacity="0.10" stroke="#db61a2" stroke-opacity="0.55"/><text x="969.0" y="378.78" font-size="10.5" class="mono" fill="#db61a2" text-anchor="middle">customerId = current user</text>
<rect x="654" y="387" width="96" height="18" rx="5" fill="#db61a2" fill-opacity="0.10" stroke="#db61a2" stroke-opacity="0.55"/><text x="702.0" y="399.78" font-size="10.5" class="mono" fill="#db61a2" text-anchor="middle">fetch joins</text>
<rect x="758" y="387" width="280" height="18" rx="5" fill="#db61a2" fill-opacity="0.10" stroke="#db61a2" stroke-opacity="0.55"/><text x="898.0" y="399.78" font-size="10.5" class="mono" fill="#db61a2" text-anchor="middle">grouping · aggregates (reports, facets)</text>
<text x="1114" y="355" font-size="11" class="mono" fill="#8b949e" text-anchor="end">the client cannot remove them</text>
<rect x="640" y="440" width="490" height="80" rx="12" fill="#161b22" stroke="#db61a2" stroke-width="1.2" filter="url(#sh)" />
<text x="656" y="465" font-size="14" fill="#e6edf3" font-weight="600">SpecificationRepository&lt;Product, UUID&gt;</text>
<text x="656" y="485" font-size="11.5" class="mono" fill="#8b949e">products.findAll(plan, pageable) · count(plan) · grouped selections</text>
<text x="656" y="506" font-size="11.5" fill="#8b949e">executes the plan as a JPA Criteria query</text>
<rect x="640" y="550" width="490" height="90" rx="12" fill="#161b22" stroke="#39c5bb" stroke-width="1.2" filter="url(#sh)" />
<text x="656" y="572" font-size="14" fill="#e6edf3" font-weight="600">JPA Criteria  →  SQL</text>
<text x="656" y="592" font-size="10.6" class="mono" fill="#39c5bb">where status = 'ACTIVE' and price_amount between 5 and 20</text>
<text x="656" y="607" font-size="10.6" class="mono" fill="#39c5bb">  and (lower(name) like '%cafe%' or tag = 'ecologico')</text>
<text x="656" y="622" font-size="10.6" class="mono" fill="#39c5bb">order by price_amount desc</text>
<path d="M1066,569.04 v43.92 a22.0,7.04 0 0 0 44,0 v-43.92" fill="#1c2128" stroke="#39c5bb" stroke-width="1.3"/><ellipse cx="1088.0" cy="569.04" rx="22.0" ry="7.04" fill="#1c2128" stroke="#39c5bb" stroke-width="1.3"/>
<text x="1088" y="634" font-size="10" class="mono" fill="#39c5bb" text-anchor="middle">catalog</text>
<rect x="578" y="214" width="44" height="18" rx="9" fill="#0d1117" stroke="#db61a2" stroke-width="1.2" />
<text x="600" y="227" font-size="10.5" class="mono" fill="#db61a2" text-anchor="middle">plan</text>
<text x="600" y="146" font-size="1" fill="#e6edf3"></text>
<rect x="530" y="522" width="140" height="22" rx="11" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2" />
<text x="600" y="537" font-size="10.5" class="mono" fill="#58a6ff" text-anchor="middle">handler → repository</text>
<text x="600" y="690" font-size="12" class="mu" text-anchor="middle">every database read in Mercado goes through a SpecificationRepository · every command, query and event goes through a bus</text>
</svg>
