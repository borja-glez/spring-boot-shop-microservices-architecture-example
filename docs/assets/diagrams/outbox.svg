<path d="M1045.0,346 V374" fill="none" stroke="#39c5bb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<rect x="40" y="240" width="150" height="92" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.2" filter="url(#sh)" />
<text x="56" y="266" font-size="13.5" fill="#e6edf3" font-weight="600">Command handler</text>
<text x="56" y="286" font-size="11" class="mono" fill="#3fb950">@HandleCommand</text>
<text x="56" y="304" font-size="11" class="mono" fill="#8b949e">PlaceOrder</text>
<text x="56" y="320" font-size="11" class="mono" fill="#8b949e">ConfirmOrder …</text>
<rect x="220" y="110" width="280" height="360" rx="14" fill="#0f1a1c" stroke="#39c5bb" stroke-width="1.2" stroke-dasharray="5 4" />
<text x="236" y="132" font-size="12" fill="#39c5bb" font-weight="600">ONE database transaction</text>
<rect x="236" y="146" width="248" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2" filter="url(#sh)" />
<text x="250" y="168" font-size="13" fill="#e6edf3" font-weight="600">aggregate</text>
<text x="250" y="190" font-size="10.6" class="mono" fill="#e6edf3">event-sourced (orders, payments):</text>
<text x="250" y="207" font-size="10.6" class="mono" fill="#8b949e">  the events are the state</text>
<text x="250" y="224" font-size="10.6" class="mono" fill="#e6edf3">state-based (catalog, inventory):</text>
<text x="250" y="241" font-size="10.6" class="mono" fill="#8b949e">  rows + events kept as outbox</text>
<rect x="236" y="272" width="248" height="184" rx="12" fill="#161b22" stroke="#39c5bb" stroke-width="1.2" filter="url(#sh)" />
<text x="250" y="294" font-size="13" class="mono" fill="#39c5bb" font-weight="600">event_store</text>
<path d="M236,308 H484" stroke="#30363d"/>
<text x="250" y="324" font-size="10" class="mono" fill="#8b949e">pos</text>
<text x="294" y="324" font-size="10" class="mono" fill="#8b949e">type</text>
<text x="406" y="324" font-size="10" class="mono" fill="#8b949e">published_at</text>
<path d="M244,332 H476" stroke="#30363d" opacity=".6"/>
<text x="250" y="348" font-size="10.5" class="mono" fill="#e6edf3">40</text>
<text x="294" y="348" font-size="10.5" class="mono" fill="#e6edf3">ProductCreated</text>
<text x="406" y="348" font-size="10.5" class="mono" fill="#3fb950">10:02:07</text>
<path d="M244,356 H476" stroke="#30363d" opacity=".6"/>
<text x="250" y="372" font-size="10.5" class="mono" fill="#e6edf3">41</text>
<text x="294" y="372" font-size="10.5" class="mono" fill="#e6edf3">OrderPlaced</text>
<text x="406" y="372" font-size="10.5" class="mono" fill="#3fb950">10:02:11</text>
<path d="M244,380 H476" stroke="#30363d" opacity=".6"/>
<g opacity="0"><rect x="242" y="381" width="236" height="21" rx="4" fill="#39c5bb" fill-opacity=".10"/><text x="250" y="396" font-size="10.5" class="mono" fill="#e6edf3">42</text><text x="294" y="396" font-size="10.5" class="mono" fill="#e6edf3">OrderConfirmed</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.100;0.115;1"/></g>
<g opacity="0"><text x="406" y="396" font-size="10.5" class="mono" fill="#d29922">null</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.100;0.115;0.505;0.520;1"/></g>
<g opacity="0"><text x="406" y="396" font-size="10.5" class="mono" fill="#3fb950">10:02:12</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.520;0.535;1"/></g>
<text x="250" y="432" font-size="10" class="mono" fill="#8b949e">global_position orders all events</text>
<text x="250" y="446" font-size="10" class="mono" fill="#8b949e">published_at = null → not yet sent</text>
<rect x="540" y="200" width="220" height="196" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="1.2" filter="url(#sh)" />
<text x="556" y="226" font-size="14" fill="#e6edf3" font-weight="600">OutboxRelay</text>
<rect x="537" y="197" width="226" height="202" rx="15" fill="none" stroke="#f0883e" stroke-width="2" class="pulse" style="animation-delay:0s"/>
<text x="556" y="250" font-size="10.6" class="mono" fill="#39c5bb">select … from event_store</text>
<text x="556" y="266" font-size="10.6" class="mono" fill="#39c5bb">where published_at is null</text>
<text x="556" y="282" font-size="10.6" class="mono" fill="#39c5bb">order by global_position</text>
<text x="556" y="298" font-size="10.6" class="mono" fill="#39c5bb">for update skip locked</text>
<path d="M552,318 H748" stroke="#30363d"/>
<text x="556" y="340" font-size="11" class="mono" fill="#e6edf3">1  publish to Kafka</text>
<text x="556" y="358" font-size="11" class="mono" fill="#e6edf3">2  wait for broker ack</text>
<text x="556" y="376" font-size="11" class="mono" fill="#3fb950">3  set published_at</text>
<text x="528" y="440" font-size="10" class="mono" fill="#3fb950">mark</text>
<rect x="815" y="150" width="76" height="300" rx="12" fill="#1b1510" stroke="#f0883e" stroke-width="1.2" filter="url(#sh)" />
<text x="853.0" y="174" font-size="13" fill="#f0883e" font-weight="600" text-anchor="middle">Kafka</text>
<text x="853.0" y="190" font-size="9.5" class="mono" fill="#f0883e" text-anchor="middle">shop.events</text>
<path d="M833,206 V422" stroke="#f0883e" stroke-width="10" stroke-opacity=".12" stroke-linecap="round"/>
<path d="M833,210 V418" stroke="#f0883e" stroke-width="1.4" class="flow" style="animation-duration:1.4s"/>
<text x="833" y="440" font-size="9" class="mono" fill="#8b949e" text-anchor="middle">p0</text>
<path d="M855,206 V422" stroke="#f0883e" stroke-width="10" stroke-opacity=".12" stroke-linecap="round"/>
<path d="M855,210 V418" stroke="#f0883e" stroke-width="1.4" class="flow" style="animation-duration:1.7s"/>
<text x="855" y="440" font-size="9" class="mono" fill="#8b949e" text-anchor="middle">p1</text>
<path d="M877,206 V422" stroke="#f0883e" stroke-width="10" stroke-opacity=".12" stroke-linecap="round"/>
<path d="M877,210 V418" stroke="#f0883e" stroke-width="1.4" class="flow" style="animation-duration:2.0s"/>
<text x="877" y="440" font-size="9" class="mono" fill="#8b949e" text-anchor="middle">p2</text>
<text x="787.5" y="272" font-size="10" class="mono" fill="#f0883e" text-anchor="middle">publish</text>
<text x="787.5" y="326" font-size="10" class="mono" fill="#3fb950" text-anchor="middle">ack</text>
<rect x="930" y="150" width="230" height="196" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.2" filter="url(#sh)" />
<text x="946" y="176" font-size="14" fill="#e6edf3" font-weight="600">IdempotentConsumer</text>
<text x="946" y="194" font-size="10.6" class="mono" fill="#8b949e">consumer group: reporting</text>
<rect x="942" y="206" width="206" height="72" rx="8" fill="#0f1a1c" stroke="#39c5bb" stroke-width="1.2" stroke-dasharray="4 3" />
<text x="954" y="226" font-size="10.6" class="mono" fill="#39c5bb">insert processed_message</text>
<text x="954" y="243" font-size="10.6" class="mono" fill="#39c5bb">  (consumer, eventId)</text>
<text x="954" y="260" font-size="10.6" class="mono" fill="#e6edf3">+ update projection</text>
<text x="1140" y="274" font-size="9.5" class="mono" fill="#39c5bb" text-anchor="end">same tx</text>
<g opacity="0"><rect x="942" y="292" width="206" height="40" rx="8" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".6"/><text x="1045.0" y="309" font-size="11.5" fill="#3fb950" font-weight="600" text-anchor="middle">✓ first delivery</text><text x="1045.0" y="325" font-size="10.5" class="mono" fill="#3fb950" text-anchor="middle">projection updated</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.600;0.615;0.725;0.740;1"/></g>
<g opacity="0"><rect x="942" y="292" width="206" height="40" rx="8" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".6"/><text x="1045.0" y="309" font-size="11.5" fill="#f85149" font-weight="600" text-anchor="middle">✕ duplicate ignored</text><text x="1045.0" y="325" font-size="10.5" class="mono" fill="#f85149" text-anchor="middle">eventId already processed</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.840;0.855;0.965;0.980;1"/></g>
<g><text x="1045.0" y="317" font-size="10.5" class="mono" fill="#8b949e" text-anchor="middle">waiting for events …</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="1;1;0;0;1;1;0;0;1" keyTimes="0;0.58;0.60;0.74;0.76;0.82;0.84;0.98;1"/></g>
<text x="910.5" y="222" font-size="10" class="mono" fill="#f0883e" text-anchor="middle">poll</text>
<path d="M975,398.4 v51.199999999999996 a70.0,22.400000000000002 0 0 0 140,0 v-51.199999999999996" fill="#1c2128" stroke="#39c5bb" stroke-width="1.3"/><ellipse cx="1045.0" cy="398.4" rx="70.0" ry="22.400000000000002" fill="#1c2128" stroke="#39c5bb" stroke-width="1.3"/>
<text x="1045" y="434" font-size="12.5" fill="#e6edf3" font-weight="600" text-anchor="middle">projection</text>
<text x="1045" y="452" font-size="10" class="mono" fill="#39c5bb" text-anchor="middle">order_view · report_*</text>
<path d="M220,492 V500 H500 V492" fill="none" stroke="#39c5bb" stroke-width="1.4"/>
<text x="360.0" y="522" font-size="14" fill="#39c5bb" font-weight="600" text-anchor="middle">atomic</text>
<text x="360.0" y="540" font-size="11" fill="#8b949e" text-anchor="middle">state + event committed together, or neither</text>
<path d="M540,492 V500 H910 V492" fill="none" stroke="#f0883e" stroke-width="1.4"/>
<text x="725.0" y="522" font-size="14" fill="#f0883e" font-weight="600" text-anchor="middle">at-least-once delivery</text>
<text x="725.0" y="540" font-size="11" fill="#8b949e" text-anchor="middle">a crash after publish but before mark → the event is sent again</text>
<path d="M930,492 V500 H1160 V492" fill="none" stroke="#3fb950" stroke-width="1.4"/>
<text x="1045.0" y="522" font-size="14" fill="#3fb950" font-weight="600" text-anchor="middle">exactly-once effect</text>
<text x="1045.0" y="540" font-size="11" fill="#8b949e" text-anchor="middle">duplicates are detected and dropped</text>
<text x="600" y="580" font-size="11.5" fill="#8b949e" text-anchor="middle">the relay only marks published_at after the broker ack · SKIP LOCKED lets several relay instances share the table without double work</text>
