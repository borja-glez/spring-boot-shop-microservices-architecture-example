@keyframes dash{to{stroke-dashoffset:-11}}
@keyframes dashr{to{stroke-dashoffset:11}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.75}}
</style>
<rect x="0.5" y="0.5" width="1199" height="609" rx="16" fill="url(#panel)" stroke="#30363d"/>

<text x="40" y="48" font-size="24" fill="#e6edf3" font-weight="700">Transactional outbox + idempotent consumers</text>
<text x="40" y="72" font-size="13" class="mu">state and event are committed together; the relay publishes later; consumers make redelivery harmless</text>
