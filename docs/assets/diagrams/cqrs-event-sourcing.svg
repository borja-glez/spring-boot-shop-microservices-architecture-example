<path d="M680,442 H642" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<path d="M470,442 H508" fill="none" stroke="#db61a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-pink)"/>
<path d="M210,442 H248" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<rect x="40" y="130" width="170" height="76" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.2" filter="url(#sh)" />
<text x="54" y="154" font-size="13.5" fill="#e6edf3" font-weight="600">Client</text>
<text x="54" y="174" font-size="10.8" class="mono" fill="#58a6ff">POST /api/orders</text>
<text x="54" y="191" font-size="10.8" class="mono" fill="#8b949e">(checkout)</text>
<rect x="250" y="130" width="190" height="76" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.2" filter="url(#sh)" />
<text x="264" y="154" font-size="13" fill="#e6edf3" font-weight="600">PlaceOrderCommand</text>
<text x="264" y="174" font-size="10.8" class="mono" fill="#3fb950">CommandBus</text>
<text x="264" y="191" font-size="10.8" class="mono" fill="#8b949e">@HandleCommand</text>
<rect x="480" y="130" width="210" height="100" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.2" filter="url(#sh)" />
<text x="494" y="154" font-size="13.5" fill="#e6edf3" font-weight="600">Order aggregate</text>
<text x="494" y="174" font-size="10.8" class="mono" fill="#e6edf3">1 load + replay stream</text>
<text x="494" y="191" font-size="10.8" class="mono" fill="#e6edf3">2 decide → new events</text>
<text x="494" y="208" font-size="10.8" class="mono" fill="#e6edf3">3 append</text>
<rect x="477" y="127" width="216" height="106" rx="15" fill="none" stroke="#3fb950" stroke-width="2" class="pulse" style="animation-delay:0s"/>
<rect x="760" y="124" width="396" height="198" rx="12" fill="#161b22" stroke="#39c5bb" stroke-width="1.2" filter="url(#sh)" />
<text x="776" y="149" font-size="13.5" class="mono" fill="#39c5bb" font-weight="600">event_store</text>
<text x="1140" y="149" font-size="11" class="mono" fill="#8b949e" text-anchor="end">stream order / 42</text>
<path d="M760,160 H1156" stroke="#30363d"/>
<rect x="774" y="172" width="368" height="28" rx="6" fill="#3fb950" fill-opacity=".08" stroke="#3fb950" stroke-opacity=".45"/>
<text x="786" y="191" font-size="11.5" class="mono" fill="#3fb950" font-weight="700">v1</text>
<text x="816" y="191" font-size="11.5" class="mono" fill="#e6edf3">OrderPlaced</text>
<text x="1130" y="191" font-size="10.2" class="mono" fill="#8b949e" text-anchor="end">expected 0 → new stream</text>
<rect x="774" y="206" width="368" height="28" rx="6" fill="#3fb950" fill-opacity=".08" stroke="#3fb950" stroke-opacity=".45"/>
<text x="786" y="225" font-size="11.5" class="mono" fill="#3fb950" font-weight="700">v2</text>
<text x="816" y="225" font-size="11.5" class="mono" fill="#e6edf3">OrderConfirmed</text>
<text x="1130" y="225" font-size="10.2" class="mono" fill="#8b949e" text-anchor="end">saga CONFIRM_ORDER, expected 1</text>
<rect x="774" y="240" width="368" height="28" rx="6" fill="#f85149" fill-opacity=".08" stroke="#f85149" stroke-opacity=".45"/>
<text x="786" y="259" font-size="11.5" class="mono" fill="#f85149" font-weight="700">v3</text>
<text x="816" y="259" font-size="11.5" class="mono" fill="#e6edf3">OrderCancelled</text>
<text x="1130" y="259" font-size="10.2" class="mono" fill="#8b949e" text-anchor="end">expected 2 · customer cancels</text>
<text x="776" y="294" font-size="10.5" class="mono" fill="#d29922">append(type, id, expectedVersion, events)</text>
<text x="776" y="310" font-size="10.5" class="mono" fill="#d29922">stale version → ConcurrencyConflictException</text>
<g opacity="0"><rect x="772" y="170" width="372" height="32" rx="7" fill="none" stroke="#3fb950" stroke-width="2" filter="url(#gl)"/><animate attributeName="opacity" dur="11.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.300;0.315;0.405;0.420;1"/></g>
<text x="725" y="150" font-size="10.5" class="mono" fill="#3fb950" text-anchor="middle">append</text>
<text x="725" y="216" font-size="10.5" class="mono" fill="#39c5bb" text-anchor="middle">replay</text>
<rect x="40" y="238" width="170" height="76" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.2" filter="url(#sh)" />
<text x="54" y="262" font-size="13.5" fill="#e6edf3" font-weight="600">Client</text>
<text x="54" y="282" font-size="10.8" class="mono" fill="#58a6ff">GET /api/orders/</text>
<text x="54" y="299" font-size="10.8" class="mono" fill="#58a6ff">  {id}/history</text>
<rect x="330" y="278" width="330" height="24" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2" />
<text x="495" y="294" font-size="10.8" class="mono" fill="#58a6ff" text-anchor="middle">GetOrderHistoryQuery · reads the stream</text>
<text x="748" y="318" font-size="11" fill="#58a6ff" font-weight="600" text-anchor="end">strong consistency</text>
<rect x="930" y="392" width="226" height="100" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="1.2" filter="url(#sh)" />
<text x="944" y="416" font-size="13.5" fill="#e6edf3" font-weight="600">OutboxRelay → Kafka</text>
<text x="944" y="436" font-size="10.8" class="mono" fill="#f0883e">topic shop.events</text>
<text x="944" y="453" font-size="10.8" class="mono" fill="#8b949e">unpublished rows, in</text>
<text x="944" y="470" font-size="10.8" class="mono" fill="#8b949e">global_position order</text>
<rect x="680" y="392" width="210" height="100" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.2" filter="url(#sh)" />
<text x="694" y="416" font-size="13.5" fill="#e6edf3" font-weight="600">OrderViewProjector</text>
<text x="694" y="436" font-size="10.8" class="mono" fill="#58a6ff">@HandleEvent</text>
<text x="694" y="453" font-size="10.8" class="mono" fill="#8b949e">IdempotentConsumer</text>
<text x="694" y="470" font-size="10.8" class="mono" fill="#8b949e">upsert per order</text>
<path d="M510,414.8 v54.4 a65.0,20.8 0 0 0 130,0 v-54.4" fill="#1c2128" stroke="#58a6ff" stroke-width="1.3"/><ellipse cx="575.0" cy="414.8" rx="65.0" ry="20.8" fill="#1c2128" stroke="#58a6ff" stroke-width="1.3"/>
<text x="575" y="450" font-size="13" class="mono" fill="#e6edf3" font-weight="600" text-anchor="middle">order_view</text>
<text x="575" y="468" font-size="10.5" fill="#8b949e" text-anchor="middle">read model</text>
<rect x="250" y="392" width="220" height="100" rx="12" fill="#161b22" stroke="#db61a2" stroke-width="1.2" filter="url(#sh)" />
<text x="264" y="416" font-size="13" fill="#e6edf3" font-weight="600">ListMyOrdersQuery</text>
<text x="264" y="436" font-size="10.8" class="mono" fill="#db61a2">SpecificationRepository</text>
<text x="264" y="453" font-size="10.8" class="mono" fill="#8b949e">+ customerId = me</text>
<text x="264" y="470" font-size="10.8" class="mono" fill="#8b949e">+ client filters, sort</text>
<rect x="40" y="392" width="170" height="100" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.2" filter="url(#sh)" />
<text x="54" y="416" font-size="13.5" fill="#e6edf3" font-weight="600">Client</text>
<text x="54" y="436" font-size="10.8" class="mono" fill="#58a6ff">GET /api/orders</text>
<text x="54" y="453" font-size="10.8" class="mono" fill="#8b949e">?filter=status:</text>
<text x="54" y="470" font-size="10.8" class="mono" fill="#8b949e">  eq:CONFIRMED</text>
<text x="785" y="514" font-size="11" fill="#58a6ff" font-weight="600" text-anchor="middle">eventual consistency · the view trails the stream by milliseconds</text>
<text x="600" y="572" font-size="11.5" fill="#8b949e" text-anchor="middle">the stream is the source of truth · order_view can be dropped and rebuilt by replaying events · both sides live in orders-service with their own tables</text>
