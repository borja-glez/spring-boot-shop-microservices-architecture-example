<text x="40" y="48" font-size="24" fill="#e6edf3" font-weight="700">CQRS + event sourcing</text>
<text x="304" y="48" font-size="24" fill="#8b949e">· orders-service</text>
<text x="40" y="72" font-size="13" class="mu">the write model is the event stream; the read model is a projection of it</text>
<rect x="24" y="92" width="1152" height="238" rx="14" fill="#0f1712" stroke="#3fb950" stroke-width="1" stroke-dasharray="4 4" />
<text x="40" y="114" font-size="11.5" fill="#3fb950" font-weight="700">WRITE SIDE · commands</text>
<rect x="24" y="350" width="1152" height="176" rx="14" fill="#0f141d" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4 4" />
<text x="40" y="372" font-size="11.5" fill="#58a6ff" font-weight="700">READ SIDE · queries</text>
