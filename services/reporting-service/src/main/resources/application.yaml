spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reporting}
    username: ${DB_USER:reporting}
    password: ${DB_PASSWORD:reporting}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000 # ms (Hikari binds a long, not a Duration)
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    # Service migrations plus es-kit's (its processed_message table makes the projections
    # idempotent; its event store is not used here).
    locations: classpath:db/migration,classpath:db/eskit
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}

server:
  port: ${SERVER_PORT:8086}

cqrs:
  naming:
    prefix: shop
  kafka:
    prefix: shop
    # Reporting only reads integration events.
    commands:
      enabled: false
    queries:
      enabled: false

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

info:
  service:
    description: Sales, products, rejections and customers from its own projections of the events
