[versions]
spring-boot = "4.0.8"
# notifications-service stays on Boot 3.5 (Jackson 2) to check both generations interoperate.
spring-boot3 = "3.5.16"
spring-cloud = "2025.1.3"
cqrs = "0.3.1"
specrepo = "0.3.1"
archunit = "1.5.0"
graalvm-native = "1.1.14"
# Must match the Hibernate of the Spring Boot BOM.
hibernate = "7.2.24.Final"
lombok-plugin = "9.2.0"
# OpenTelemetry Logback appender (OTLP log export); each matches the OpenTelemetry SDK of its Boot BOM.
otel-logback = "2.21.0-alpha"
otel-logback-boot3 = "2.15.0-alpha"
spotless = "8.4.0"

[libraries]
# Platforms
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot3-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot3" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

# Libraries under test
cqrs-core = { module = "com.borjaglez.cqrs:spring-boot-cqrs-core", version.ref = "cqrs" }
cqrs-boot4-starter = { module = "com.borjaglez.cqrs:spring-boot-cqrs-boot4-starter", version.ref = "cqrs" }
cqrs-boot3-starter = { module = "com.borjaglez.cqrs:spring-boot-cqrs-boot3-starter", version.ref = "cqrs" }
cqrs-rabbitmq = { module = "com.borjaglez.cqrs:spring-boot-cqrs-rabbitmq", version.ref = "cqrs" }
cqrs-kafka = { module = "com.borjaglez.cqrs:spring-boot-cqrs-kafka", version.ref = "cqrs" }
cqrs-test = { module = "com.borjaglez.cqrs:spring-boot-cqrs-test", version.ref = "cqrs" }
specrepo-core = { module = "com.borjaglez.specrepository:specification-repository-core", version.ref = "specrepo" }
specrepo-boot4-starter = { module = "com.borjaglez.specrepository:specification-repository-boot4-starter", version.ref = "specrepo" }
specrepo-boot3-starter = { module = "com.borjaglez.specrepository:specification-repository-boot3-starter", version.ref = "specrepo" }
specrepo-http = { module = "com.borjaglez.specrepository:specification-repository-http", version.ref = "specrepo" }

# Spring Boot starters (versions from the Boot BOM)
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
# Boot 3 name of the servlet web starter.
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-autoconfigure-processor = { module = "org.springframework.boot:spring-boot-autoconfigure-processor" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-boot-data-commons = { module = "org.springframework.boot:spring-boot-data-commons" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-cloud-gateway-server-webmvc = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
# Tracing for the Boot 3 service (Boot 4 services use spring-boot-starter-opentelemetry).
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
micrometer-tracing = { module = "io.micrometer:micrometer-tracing" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
micrometer-registry-otlp = { module = "io.micrometer:micrometer-registry-otlp" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "otel-logback" }
opentelemetry-logback-appender-boot3 = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "otel-logback-boot3" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
slf4j-api = { module = "org.slf4j:slf4j-api" }

# Boot 3 has no starters for these; the Boot 3 BOM manages their versions.
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
flyway-core = { module = "org.flywaydb:flyway-core" }

# Persistence
postgresql = { module = "org.postgresql:postgresql" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Testing
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-rabbitmq = { module = "org.testcontainers:testcontainers-rabbitmq" }
# Testcontainers 1.x artifact names, managed by the Boot 3.5 BOM.
testcontainers1-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers1-kafka = { module = "org.testcontainers:kafka" }
testcontainers1-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
awaitility = { module = "org.awaitility:awaitility" }
# Jackson 3 (managed by the Boot 4 BOM), for the system tests' JSON.
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

# Build logic
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
hibernate-gradle-plugin = { module = "org.hibernate.orm:hibernate-gradle-plugin", version.ref = "hibernate" }
graalvm-native-gradle-plugin = { module = "org.graalvm.buildtools:native-gradle-plugin", version.ref = "graalvm-native" }
lombok-gradle-plugin = { module = "io.freefair.gradle:lombok-plugin", version.ref = "lombok-plugin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
