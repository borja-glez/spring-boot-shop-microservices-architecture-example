group=com.borjaglez.shop
version=0.1.0-SNAPSHOT

# The libraries come from Maven Central (versions in gradle/libs.versions.toml). Set to true to use
# the sibling checkouts through a composite build instead, to try unreleased library changes
# (-Pshop.localLibs=true works too).
shop.localLibs=false
# Checkouts used by the composite build.
shop.cqrsPath=../spring-boot-cqrs
shop.specrepoPath=../spring-boot-specification-repository

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
