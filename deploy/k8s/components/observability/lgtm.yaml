# grafana/otel-lgtm: OTLP collector, Tempo, Prometheus, Loki and Grafana in one pod (demo only; a
# production cluster runs them separately, with persistent storage).
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: shop
  labels:
    app.kubernetes.io/name: lgtm
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: shop
  labels:
    app.kubernetes.io/name: lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.34.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
            - containerPort: 4318
          resources:
            # Collector, Tempo, Prometheus, Loki and Grafana share this limit.
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 4318
            periodSeconds: 10
          volumeMounts:
            - name: provisioning
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/shop.yaml
              subPath: dashboards.yaml
            - name: provisioning
              mountPath: /otel-lgtm/grafana/conf/provisioning/alerting/shop-alerts.yaml
              subPath: shop-alerts.yaml
            - name: dashboards
              mountPath: /otel-lgtm/shop-dashboards
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
