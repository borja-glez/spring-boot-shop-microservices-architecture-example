# At most one replica of each scaled service is evicted at a time (node drains, cluster upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-service
  namespace: shop
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: shop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
---
