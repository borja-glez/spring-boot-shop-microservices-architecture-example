apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  labels:
    app.kubernetes.io/name: notifications-service
spec:
  selector:
    app.kubernetes.io/name: notifications-service
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  labels:
    app.kubernetes.io/name: notifications-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications-service
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: shop/notifications-service
          ports:
            - name: http
              containerPort: 8085
          env:
            # Requests run on virtual threads; the Paketo memory calculator only needs stack
            # space for a few platform threads (default 250 would eat most of the limit).
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: notifications
            - name: DB_USER
              value: notifications
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-credentials
                  key: db-password
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-credentials
                  key: rabbitmq-password
          # Liveness only says "the process works"; readiness also needs the database.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            # Give the endpoints controller time to stop routing traffic before shutdown.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
