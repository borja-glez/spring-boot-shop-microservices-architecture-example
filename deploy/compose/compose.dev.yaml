# Everything but the services and the frontend, for running them from an IDE or Gradle:
#   docker compose -f deploy/compose/compose.dev.yaml up -d
# PostgreSQL, RabbitMQ and Kafka as in compose.infra.yaml, plus Grafana LGTM with OTLP published on
# http://localhost:4318. Start the services with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# to see them in Grafana (http://localhost:3000); see docs/en/deployment.md, "Local development".
name: shop

include:
  - compose.infra.yaml
  - compose.lgtm.yaml
