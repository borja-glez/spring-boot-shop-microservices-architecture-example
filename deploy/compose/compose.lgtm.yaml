# Grafana LGTM (OpenTelemetry collector, Tempo, Prometheus, Loki and Grafana) with the shop
# dashboards and alert rules. Included by compose.observability.yaml and compose.dev.yaml.
name: shop

services:
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    ports:
      - "3000:3000"
      # OTLP over HTTP, for services started outside Docker.
      - "4318:4318"
    # Same provisioning files as the Kubernetes observability component.
    volumes:
      - ../k8s/components/observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/shop.yaml:ro
      - ../k8s/components/observability/grafana/dashboards:/otel-lgtm/shop-dashboards:ro
      - ../k8s/components/observability/grafana/alerting/shop-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/shop-alerts.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Collector, Tempo, Prometheus, Loki and Grafana share this limit.
          memory: 2g
